# foot terminal (runs inside the devenv toolbox, launched by ~/.local/share/applications/herdr.desktop)
# The font is read from the shared ~/.local/share/fonts; it is not installed in the container.
[main]
font=JetBrainsMonoNL Nerd Font:size=12, Twemoji:size=12
initial-window-mode=maximized
initial-window-size-chars=180x50
pad=4x4
